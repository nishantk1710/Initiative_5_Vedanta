[pytest]
testpaths = python/tests
# python/ is not a package (modules import each other flatly, e.g.
# `from router import ...`), so it has to be on sys.path for tests to import
# them the same way main.py does.
pythonpath = python
markers =
    slow: runs the real OCR/layout pipeline (tens of seconds per page; needs models warmed)
    llm: requires live Azure credentials in .env — skipped automatically when unconfigured
# Fast by default: the full pipeline is ~60-90s per scanned page on CPU, so an
# unmarked `pytest` run must stay usable as a pre-commit signal.
addopts = -m "not slow" --strict-markers -q
